kind = "mobile"
previewPath = "/"
title = "SkillAd"
version = "1.0.0"
id = "artifacts/skilladd-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25376

[services.development]
run = "pnpm --filter @workspace/skilladd-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skilladd-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/skilladd-app", "run", "serve" ]

[services.env]
PORT = "25376"
BASE_PATH = "/"
