# SkillAd — pnpm workspace configuration
# Cross-platform version (works on Windows, macOS, Linux)
# Replit-specific overrides and minimumReleaseAge settings have been removed.

packages:
  - admin-panel
  - api-server
  - landing-page
  - mobile-app
  - shared-libs/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

overrides:
  # Pin esbuild version for consistency across packages
  esbuild: "0.27.3"
  # drizzle-kit uses esbuild internally on an older version; replace with tsx
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  # Force a single @expo/cli matching expo@54.0.35 (prevents 54.0.23 + 54.0.25 dual install)
  "@expo/cli": "54.0.25"

allowBuilds:
  esbuild: true
  sharp: true
